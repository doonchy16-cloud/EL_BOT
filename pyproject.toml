[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "el-bot"
version = "0.1.0"
description = "Deterministic core for Emoji Language (EL) parsing and validation."
requires-python = ">=3.11"
dependencies = [
  "regex>=2024.11.6",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
