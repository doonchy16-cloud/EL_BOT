name: TEMP QuoteSnap V3.4 live OLD
on:
  push:
    branches: ['deploy/quotesnap-v34-20260909']
    paths: ['.github/workflows/temp-quotesnap-v34-live-old.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - name: Sample OLD-PC coordinator across round transition
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ine 'DESKTOP-V9SCI9V'){throw "WRONG_MACHINE=$env:COMPUTERNAME"}
          $root='D:\QuoteSnap\AI\V3.3_AIO';$status=Join-Path $root 'State\cluster_status.json'
          for($i=1;$i -le 15;$i++){
            $now=Get-Date -Format o
            try{$s=Get-Content $status -Raw|ConvertFrom-Json}catch{$s=$null}
            if($s){
              $workers=@($s.workers)
              $ws=($workers|ForEach-Object{"$($_.node_id):$($_.state):step=$($_.local_window_step):r=$($_.round):spd=$($_.steps_per_second)"}) -join ';'
              Write-Host "SAMPLE=$i NOW=$now CAN=$($s.canonical_step) ROUND=$($s.round) CTRL=$($s.control_state) FB=$($s.fallback) WORKERS=$($workers.Count) [$ws]"
            }else{Write-Host "SAMPLE=$i NOW=$now STATUS_UNREADABLE"}
            & nvidia-smi --query-gpu=utilization.gpu,memory.used,power.draw --format=csv,noheader
            Start-Sleep 10
          }
          Write-Host 'OLD_ROUND_TRACE_DONE'