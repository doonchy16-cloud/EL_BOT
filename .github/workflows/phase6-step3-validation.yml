name: "🦙 Phase 6 Step 3 Teacher + Learning Validation"

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "phase6-step3-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  teacher_learning:
    name: "🦙🧠 Forgey Teacher → G2 → Promotion"
    runs-on:
      - self-hosted
      - Windows
      - X64
    timeout-minutes: 90
    steps:
      - name: "📥 Source"
        uses: actions/checkout@v4

      - name: "🐍 Python 3.12"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TOOL_CACHE 'ELPython\3.12.10'
          $exe = Join-Path $dir 'python.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            $zip = Join-Path $env:RUNNER_TEMP 'python.zip'
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip' -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          }
          $pth = Join-Path $dir 'python312._pth'
          if (Test-Path -LiteralPath $pth) {
            $text = Get-Content -LiteralPath $pth -Raw
            if ($text -match '#import site') {
              $text = $text -replace '#import site','import site'
              [System.IO.File]::WriteAllText($pth,$text,[System.Text.UTF8Encoding]::new($false))
            }
          }
          & $exe -c "import sys; assert sys.version_info[:2] == (3, 12); print(sys.version)"
          "EL_PYTHON=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: "📖🌐 Materialize Step 1 knowledge"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File 'scripts\materialize-phase6-step1-knowledge.ps1'

      - name: "🧪 Step 1 compatibility"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONIOENCODING = 'utf-8'
          & $env:EL_PYTHON 'architecture\verify_phase6_step1_knowledge_foundation.py'
          if ($LASTEXITCODE -ne 0) { throw 'PHASE6_STEP3_STEP1_COMPAT_FAILED' }

      - name: "🔥 PyTorch 2.13 CPU"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $torchDir = Join-Path $env:RUNNER_TOOL_CACHE 'ELTorch\2.13.0-cp312'
          $marker = Join-Path $torchDir '.ready'
          if (-not (Test-Path -LiteralPath $marker)) {
            if (Test-Path -LiteralPath $torchDir) { Remove-Item -LiteralPath $torchDir -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $torchDir | Out-Null
            $pipDir = Join-Path $env:RUNNER_TOOL_CACHE 'ELPip'
            $pipz = Join-Path $pipDir 'pip.pyz'
            New-Item -ItemType Directory -Force -Path $pipDir | Out-Null
            if (-not (Test-Path -LiteralPath $pipz)) {
              Invoke-WebRequest -UseBasicParsing -Uri 'https://bootstrap.pypa.io/pip/pip.pyz' -OutFile $pipz
            }
            & $env:EL_PYTHON $pipz install --disable-pip-version-check --only-binary=:all: --target $torchDir -r 'requirements-phase6-step2.txt'
            if ($LASTEXITCODE -ne 0) { throw 'PHASE6_STEP3_TORCH_INSTALL_FAILED' }
            Set-Content -LiteralPath $marker -Value 'torch 2.13.0 cp312 ready' -Encoding ASCII
          }
          $pyDir = Split-Path -Parent $env:EL_PYTHON
          $pth = Join-Path $pyDir 'python312._pth'
          if (-not (Test-Path -LiteralPath $pth)) { throw 'PHASE6_STEP3_PYTHON_PTH_MISSING' }
          $lines = @(Get-Content -LiteralPath $pth | Where-Object { $_ -notmatch 'ELTorch\\' })
          $lines += $torchDir
          if (-not ($lines -contains 'import site')) { $lines += 'import site' }
          [System.IO.File]::WriteAllLines($pth,$lines,[System.Text.UTF8Encoding]::new($false))
          & $env:EL_PYTHON -c "import torch; assert torch.__version__.startswith('2.13.0'); print('TORCH_OK', torch.__version__, 'cuda=', torch.cuda.is_available())"
          if ($LASTEXITCODE -ne 0) { throw 'PHASE6_STEP3_TORCH_IMPORT_FAILED' }
          "EL_TORCH_SITE=$torchDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: "🏋️ Reconstruct Step 2 G1"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONIOENCODING = 'utf-8'
          $output = Join-Path (Get-Location) 'data\phase6-step2'
          & $env:EL_PYTHON 'scripts\phase6-step2-train-g1.py' --output $output --steps 480 --batch-size 28
          if ($LASTEXITCODE -ne 0) { throw 'PHASE6_STEP3_G1_TRAIN_FAILED' }
          & $env:EL_PYTHON 'scripts\phase6-step2-rehearse-g1.py' --artifact-dir $output --steps 240 --batch-size 32
          if ($LASTEXITCODE -ne 0) { throw 'PHASE6_STEP3_G1_REHEARSAL_FAILED' }

      - name: "⚡ Reconstruct Step 2 local inference evidence"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONIOENCODING = 'utf-8'
          $rocket = [char]::ConvertFromUtf32(0x1F680)
          & $env:EL_PYTHON 'scripts\phase6-step2-infer.py' --artifact-dir 'data\phase6-step2' --direction 'ABC_TO_EL' --text 'rocket' --expected $rocket --evidence 'data\phase6-step2\infer-abc-to-el.json'
          if ($LASTEXITCODE -ne 0) { throw 'PHASE6_STEP3_G1_FORWARD_FAILED' }
          & $env:EL_PYTHON 'scripts\phase6-step2-infer.py' --artifact-dir 'data\phase6-step2' --direction 'EL_TO_ABC' --text $rocket --expected 'rocket' --evidence 'data\phase6-step2\infer-el-to-abc.json'
          if ($LASTEXITCODE -ne 0) { throw 'PHASE6_STEP3_G1_REVERSE_FAILED' }

      - name: "🧪 Step 2 compatibility"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONIOENCODING = 'utf-8'
          & $env:EL_PYTHON 'architecture\verify_phase6_step2_g0_g1.py'
          if ($LASTEXITCODE -ne 0) { throw 'PHASE6_STEP3_STEP2_COMPAT_FAILED' }

      - name: "🦙 Verify real Qwen teacher"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONIOENCODING = 'utf-8'
          & $env:EL_PYTHON -c "import importlib.machinery,importlib.util,pathlib,sys; p=pathlib.Path(chr(0x1F999))/chr(0x1F999); l=importlib.machinery.SourceFileLoader('_p6s3_qwen_probe',str(p)); s=importlib.util.spec_from_loader('_p6s3_qwen_probe',l); m=importlib.util.module_from_spec(s); sys.modules['_p6s3_qwen_probe']=m; l.exec_module(m); c=m.OllamaConnector(generation_timeout=300.0); e=c.probe(); print('QWEN_TEACHER',e.render_el(),e.model); assert e.reachable and e.model_present and e.model=='qwen2.5vl:7b'"
          if ($LASTEXITCODE -ne 0) { throw 'PHASE6_STEP3_QWEN_UNAVAILABLE' }

      - name: "🧑‍🏫🦙 Acquire + admit semantic lessons"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONIOENCODING = 'utf-8'
          $output = Join-Path (Get-Location) 'data\phase6-step3'
          & $env:EL_PYTHON 'scripts\phase6-step3-teach.py' --output $output
          if ($LASTEXITCODE -ne 0) { throw 'PHASE6_STEP3_TEACHER_FAILED' }

      - name: "🏋️🧠 Train isolated G2 candidate"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONIOENCODING = 'utf-8'
          $step2 = Join-Path (Get-Location) 'data\phase6-step2'
          $step3 = Join-Path (Get-Location) 'data\phase6-step3'
          & $env:EL_PYTHON 'scripts\phase6-step3-train-g2.py' --step2-artifact $step2 --step3-artifact $step3 --steps 360 --batch-size 40
          if ($LASTEXITCODE -ne 0) { throw 'PHASE6_STEP3_G2_TRAIN_FAILED' }

      - name: "🎓🗃️ Promotion + rejection + rollback"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONIOENCODING = 'utf-8'
          $step2 = Join-Path (Get-Location) 'data\phase6-step2'
          $step3 = Join-Path (Get-Location) 'data\phase6-step3'
          & $env:EL_PYTHON 'scripts\phase6-step3-promote.py' --step2-artifact $step2 --step3-artifact $step3
          if ($LASTEXITCODE -ne 0) { throw 'PHASE6_STEP3_PROMOTION_FAILED' }

      - name: "⚡ Selected G2 inference ABC → EL"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONIOENCODING = 'utf-8'
          $bicycle = [char]::ConvertFromUtf32(0x1F6B2)
          & $env:EL_PYTHON 'scripts\phase6-step3-infer-selected.py' --registry 'data\phase6-step3\generation-registry.json' --direction 'ABC_TO_EL' --text 'vehicle powered by pedals with two wheels' --expected $bicycle --evidence 'data\phase6-step3\infer-selected-forward.json'
          if ($LASTEXITCODE -ne 0) { throw 'PHASE6_STEP3_SELECTED_FORWARD_FAILED' }

      - name: "⚡ Selected G2 inference EL → ABC"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONIOENCODING = 'utf-8'
          $bicycle = [char]::ConvertFromUtf32(0x1F6B2)
          & $env:EL_PYTHON 'scripts\phase6-step3-infer-selected.py' --registry 'data\phase6-step3\generation-registry.json' --direction 'EL_TO_ABC' --text $bicycle --expected 'bicycle' --evidence 'data\phase6-step3\infer-selected-reverse.json'
          if ($LASTEXITCODE -ne 0) { throw 'PHASE6_STEP3_SELECTED_REVERSE_FAILED' }

      - name: "🧪 Step 3 authority"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONIOENCODING = 'utf-8'
          & $env:EL_PYTHON 'architecture\verify_phase6_step3_teacher_learning.py'
          if ($LASTEXITCODE -ne 0) { throw 'PHASE6_STEP3_AUTHORITY_FAILED' }

      - name: "🧪 Phase 2 compatibility"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONIOENCODING = 'utf-8'
          & $env:EL_PYTHON 'architecture\verify_phase2_knowledge_foundation.py'

      - name: "🧪 Phase 3 compatibility"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONIOENCODING = 'utf-8'
          & $env:EL_PYTHON 'architecture\verify_phase3_semantic_search.py'

      - name: "🧪 44/44 diagnostics"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONIOENCODING = 'utf-8'
          & $env:EL_PYTHON -c "import importlib.machinery,importlib.util,pathlib,sys; root=pathlib.Path('.'); a=chr(0x1F9EA); p=next(x for x in root.rglob('*') if x.is_file() and x.name==a and x.parent.name==a); l=importlib.machinery.SourceFileLoader('_p6s3_diag',str(p)); s=importlib.util.spec_from_loader('_p6s3_diag',l); m=importlib.util.module_from_spec(s); sys.modules['_p6s3_diag']=m; l.exec_module(m); r=m.DiagnosticsEngine().run(); print(r.render_el()); assert r.passed and len(r.checks)==44"
