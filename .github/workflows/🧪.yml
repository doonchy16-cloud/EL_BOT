name: "🧪"

on:
  push:
    branches:
      - main
      - "⏩🏁"
  workflow_dispatch:

jobs:
  ci:
    name: "🧪🏃🪟"
    runs-on:
      - self-hosted
      - Windows
      - X64
    timeout-minutes: 5
    steps:
      - name: "📥"
        uses: actions/checkout@v4

      - name: "🐍📥"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TOOL_CACHE 'ELPython\3.12.10'
          $exe = Join-Path $dir 'python.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            $zip = Join-Path $env:RUNNER_TEMP 'python.zip'
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip' -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          }
          & $exe -c "import sys; assert sys.version_info[:2] == (3, 12)"

      - name: "🦙🔍"
        shell: powershell
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          $exe = Join-Path $env:RUNNER_TOOL_CACHE 'ELPython\3.12.10\python.exe'
          & $exe -c "import json,urllib.request; u='http://127.0.0.1:11434/api/tags'; d=json.load(urllib.request.urlopen(u,timeout=5)); names=[m.get('name','') for m in d.get('models',[])]; assert 'qwen2.5vl:7b' in names; print(chr(0x2705)+chr(0x1F999)+chr(0x1F441)+chr(0xFE0F)+'7')"

      - name: "🦙🔋"
        shell: powershell
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          $exe = Join-Path $env:RUNNER_TOOL_CACHE 'ELPython\3.12.10\python.exe'
          & $exe -c "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:11434/api/ps',timeout=5)); names=[m.get('name','') for m in d.get('models',[])]; ok='qwen2.5vl:7b' in names; print((chr(0x2705) if ok else chr(0x1F7E1))+chr(0x1F999)+(chr(0x1F50B) if ok else chr(0x1FAAB)))"
        continue-on-error: true

      - name: "🧪🦙"
        shell: powershell
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          $exe = Join-Path $env:RUNNER_TOOL_CACHE 'ELPython\3.12.10\python.exe'
          & $exe -c "import pathlib,runpy; a=chr(0x1F9EA); b=chr(0x1F999); p=next(x for x in pathlib.Path('.').rglob('*') if x.is_file() and x.name==b and x.parent.name==a); runpy.run_path(str(p),run_name='__main__')"

      - name: "🧪🔐"
        shell: powershell
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          $exe = Join-Path $env:RUNNER_TOOL_CACHE 'ELPython\3.12.10\python.exe'
          $script = Join-Path $env:RUNNER_TEMP 'el_security_probe.py'
          @'
          from importlib.machinery import SourceFileLoader
          from importlib.util import module_from_spec, spec_from_loader
          from pathlib import Path
          import sys

          root = Path('.').resolve()
          def load(name, path):
              if name in sys.modules:
                  return sys.modules[name]
              loader = SourceFileLoader(name, str(path))
              spec = spec_from_loader(name, loader)
              module = module_from_spec(spec)
              sys.modules[name] = module
              loader.exec_module(module)
              return module

          core = load('_el_core', root / '⚙️' / '⚙️')
          guard = load('_el_guard_probe', root / '🔐' / '🔐')
          source = '🔥➡️🚀'
          surface = core.CoreEngine().parse(source, el_mode=True)
          decision = guard.SecurityEngine().authorize(source)
          print(surface.status.value)
          print([(token.text, token.kind.value) for token in surface.tokens])
          print(decision.status.value, decision.authorized)
          print(surface.status.__class__ is guard.ValidationStatus)
          assert not surface.letter_tokens
          assert surface.status.value == 'pass'
          assert decision.status.value == 'pass'
          assert decision.authorized
          '@ | Set-Content -LiteralPath $script -Encoding UTF8
          & $exe $script

      - name: "🧪🤖"
        shell: powershell
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          $exe = Join-Path $env:RUNNER_TOOL_CACHE 'ELPython\3.12.10\python.exe'
          $script = Join-Path $env:RUNNER_TEMP 'el_bot_stdin_test.py'
          @'
          import pathlib
          import subprocess
          import sys

          bot = next(path for path in pathlib.Path('.').iterdir() if path.is_file() and path.name == chr(0x1F916))
          source = '🔥➡️🚀'
          result = subprocess.run(
              [sys.executable, str(bot)],
              input=source,
              text=True,
              capture_output=True,
              encoding='utf-8',
              timeout=20,
          )
          output = result.stdout.strip()
          print(output)
          assert result.returncode == 0
          assert output
          assert not output.startswith(chr(0x274C))
          '@ | Set-Content -LiteralPath $script -Encoding UTF8
          & $exe $script

      - name: "🧪⚡"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $main = Join-Path (Get-Location) '⚡\⚡'
          $preload = Join-Path (Get-Location) '⚡\🔌'
          $view = Join-Path (Get-Location) '⚡\🖥️'
          node --check $main
          node --check $preload
          if (-not (Test-Path -LiteralPath $view)) { throw 'view missing' }
          $html = Get-Content -LiteralPath $view -Raw -Encoding UTF8
          if (-not $html.Contains('▶️') -or -not $html.Contains('🧪') -or -not $html.Contains('🦙🔍')) { throw 'ui controls missing' }
          Write-Output '✅⚡🖥️'

      - name: "🧪"
        shell: powershell
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          $exe = Join-Path $env:RUNNER_TOOL_CACHE 'ELPython\3.12.10\python.exe'
          & $exe -c "import pathlib,runpy; p=next(x for x in pathlib.Path('.').rglob('*') if x.name==chr(0x2705)); runpy.run_path(str(p), run_name='__main__')"

      - name: "🚀"
        shell: powershell
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          $exe = Join-Path $env:RUNNER_TOOL_CACHE 'ELPython\3.12.10\python.exe'
          & $exe -c "import pathlib,runpy; p=next(x for x in pathlib.Path('.').rglob('*') if x.name==chr(0x1F680)); runpy.run_path(str(p), run_name='__main__')"
