name: "🧪"

on:
  push:
    branches:
      - main
      - "⏩🏁"
  workflow_dispatch:

concurrency:
  group: "🧪-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  ci:
    name: "🧪🏃🪟"
    runs-on:
      - self-hosted
      - Windows
      - X64
    timeout-minutes: 20
    steps:
      - name: "📥"
        uses: actions/checkout@v4

      - name: "🐍📥"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TOOL_CACHE 'ELPython\3.12.10'
          $exe = Join-Path $dir 'python.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            $zip = Join-Path $env:RUNNER_TEMP 'python.zip'
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip' -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          }
          & $exe -c "import sys; assert sys.version_info[:2] == (3, 12)"

      - name: "🤖❌↔️"
        shell: powershell
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          $exe = Join-Path $env:RUNNER_TOOL_CACHE 'ELPython\3.12.10\python.exe'
          $script = Join-Path $env:RUNNER_TEMP 'el_no_ai_translation.py'
          @'
          import importlib.machinery
          import importlib.util
          import os
          import pathlib
          import socket
          import sys
          import tempfile
          import urllib.request

          def blocked(*args, **kwargs):
              raise AssertionError('network access attempted during normal translation')

          socket.create_connection = blocked
          urllib.request.urlopen = blocked
          os.environ['EL_RANK_DB'] = str(pathlib.Path(tempfile.gettempdir()) / 'el-rank-no-ai.json')
          bidi = chr(0x2194) + chr(0xFE0F)
          path = next(p for p in pathlib.Path('.').rglob('*') if p.is_file() and p.name == bidi and p.parent.name == bidi)
          loader = importlib.machinery.SourceFileLoader('_el_no_ai_bidi', str(path))
          spec = importlib.util.spec_from_loader('_el_no_ai_bidi', loader)
          module = importlib.util.module_from_spec(spec)
          sys.modules['_el_no_ai_bidi'] = module
          loader.exec_module(module)
          engine = module.TranslationEngine()
          a = engine.process(2, 'Critical server error after 30 seconds. Restart the service immediately and verify success.')
          b = engine.process(1, '\U0001F4E5\u27A1\uFE0F\U0001F9EA\u27A1\uFE0F\U0001F9FE\u27A1\uFE0F\u2705\u27A1\uFE0F\U0001F680')
          assert a and not a.startswith(chr(0x274C))
          assert b and not b.startswith(chr(0x274C))
          assert engine.provider_call_count == 0
          source = path.read_text(encoding='utf-8')
          assert 'OllamaConnector' not in source and '_ollama' not in source
          print(chr(0x2705) + chr(0x2194) + chr(0xFE0F) + chr(0x1F916) + chr(0x274C))
          '@ | Set-Content -LiteralPath $script -Encoding UTF8
          & $exe $script

      - name: "🧪🔀"
        shell: powershell
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          $exe = Join-Path $env:RUNNER_TOOL_CACHE 'ELPython\3.12.10\python.exe'
          & $exe -c "import pathlib,runpy; a=chr(0x1F9EA); b=chr(0x1F500); p=next(x for x in pathlib.Path('.').rglob('*') if x.is_file() and x.name==b and x.parent.name==a); runpy.run_path(str(p),run_name='__main__')"

      - name: "🧪🔤"
        shell: powershell
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          $exe = Join-Path $env:RUNNER_TOOL_CACHE 'ELPython\3.12.10\python.exe'
          & $exe -c "import pathlib,runpy; a=chr(0x1F9EA); b=chr(0x1F524); p=next(x for x in pathlib.Path('.').rglob('*') if x.is_file() and x.name==b and x.parent.name==a); runpy.run_path(str(p),run_name='__main__')"

      - name: "🧪⚡"
        shell: powershell
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          $exe = Join-Path $env:RUNNER_TOOL_CACHE 'ELPython\3.12.10\python.exe'
          & $exe -c "import pathlib,runpy; a=chr(0x1F9EA); b=chr(0x26A1); p=next(x for x in pathlib.Path('.').rglob('*') if x.is_file() and x.name==b and x.parent.name==a); runpy.run_path(str(p),run_name='__main__')"

      - name: "🧪⚡🖥️"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $spark = [char]::ConvertFromUtf32(0x26A1)
          $plug = [char]::ConvertFromUtf32(0x1F50C)
          $screen = [char]::ConvertFromUtf32(0x1F5A5) + [char]0xFE0F
          $dir = Join-Path (Get-Location) $spark
          $main = Join-Path $dir $spark
          $preload = Join-Path $dir $plug
          $view = Join-Path $dir $screen
          $nodeCommand = Get-Command node -ErrorAction SilentlyContinue
          if ($nodeCommand) { $node = $nodeCommand.Source } else {
            $runnerRoot = Split-Path (Split-Path $env:RUNNER_TEMP -Parent) -Parent
            $node = Join-Path $runnerRoot 'externals\node24\bin\node.exe'
            if (-not (Test-Path -LiteralPath $node)) { $node = Join-Path $runnerRoot 'externals\node20\bin\node.exe' }
          }
          if (-not (Test-Path -LiteralPath $node)) { throw 'node missing' }
          & $node --check $main
          & $node --check $preload
          $mainText = Get-Content -LiteralPath $main -Raw -Encoding UTF8
          $preloadText = Get-Content -LiteralPath $preload -Raw -Encoding UTF8
          if (-not $mainText.Contains("event.sender.send('⏳'")) { throw 'live stage IPC missing' }
          if (-not $preloadText.Contains("ipcRenderer.on('⏳'")) { throw 'stage preload listener missing' }
          $html = Get-Content -LiteralPath $view -Raw -Encoding UTF8
          if (-not $html.Contains('id="mode1"') -or -not $html.Contains('id="mode2"') -or -not $html.Contains('id="image"')) { throw 'UI controls missing' }
          if (-not $html.Contains('rotate(180deg)')) { throw '180 degree hourglass flip missing' }
          if (-not $html.Contains('@media(max-width:1100px)')) { throw 'responsive control layout missing' }
          if (-not $html.Contains('id="quality"')) { throw 'translation quality badge missing' }
          Write-Output ([char]::ConvertFromUtf32(0x2705) + $spark + $screen)

      - name: "🦙🔍"
        shell: powershell
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          $exe = Join-Path $env:RUNNER_TOOL_CACHE 'ELPython\3.12.10\python.exe'
          & $exe -c "import json,urllib.request; u='http://127.0.0.1:11434/api/tags'; d=json.load(urllib.request.urlopen(u,timeout=5)); names=[m.get('name','') for m in d.get('models',[])]; assert 'qwen2.5vl:7b' in names; print(chr(0x2705)+chr(0x1F999)+chr(0x1F441)+chr(0xFE0F)+'7')"

      - name: "🧪🦙"
        shell: powershell
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          $exe = Join-Path $env:RUNNER_TOOL_CACHE 'ELPython\3.12.10\python.exe'
          & $exe -c "import pathlib,runpy; a=chr(0x1F9EA); b=chr(0x1F999); p=next(x for x in pathlib.Path('.').rglob('*') if x.is_file() and x.name==b and x.parent.name==a); runpy.run_path(str(p),run_name='__main__')"

      - name: "🧪📸"
        shell: powershell
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          $exe = Join-Path $env:RUNNER_TOOL_CACHE 'ELPython\3.12.10\python.exe'
          $script = Join-Path $env:RUNNER_TEMP 'el_vision_boundary_test.py'
          @'
          import pathlib
          import subprocess
          import sys
          import unicodedata

          jpeg = ''
          value = 'data:image/jpeg;base64,' + jpeg
          camera = chr(0x1F4F8)
          vision = next(path for path in pathlib.Path('.').rglob('*') if path.is_file() and path.name == camera and path.parent.name == camera)
          source = vision.read_text(encoding='utf-8')
          assert 'vision sensor, not a translator' in source
          assert 'OllamaConnector' in source and 'ABCToEmojiEngine' in source
          assert 'Do not translate into Emoji Language' in source
          result = subprocess.run([sys.executable, str(vision)], input='2\n' + value, text=True, capture_output=True, encoding='utf-8', timeout=360)
          output = result.stdout.strip()
          print(output)
          if result.stderr.strip(): print(result.stderr.strip())
          assert result.returncode == 0 and output and not output.startswith(chr(0x274C))
          assert not any(unicodedata.category(ch).startswith('L') for ch in output)
          '@ | Set-Content -LiteralPath $script -Encoding UTF8
          & $exe $script

      - name: "🧪"
        shell: powershell
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          $exe = Join-Path $env:RUNNER_TOOL_CACHE 'ELPython\3.12.10\python.exe'
          & $exe -c "import pathlib,runpy; p=next(x for x in pathlib.Path('.').rglob('*') if x.name==chr(0x2705)); runpy.run_path(str(p), run_name='__main__')"

      - name: "🚀"
        shell: powershell
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          $exe = Join-Path $env:RUNNER_TOOL_CACHE 'ELPython\3.12.10\python.exe'
          & $exe -c "import pathlib,runpy; p=next(x for x in pathlib.Path('.').rglob('*') if x.name==chr(0x1F680)); runpy.run_path(str(p), run_name='__main__')"
