name: "🧪"

on:
  push:
    branches:
      - main
      - "⏩🏁"
  workflow_dispatch:

concurrency:
  group: "🧪-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  ci:
    name: "🧪🏃🪟"
    runs-on:
      - self-hosted
      - Windows
      - X64
    timeout-minutes: 20
    steps:
      - name: "📥"
        uses: actions/checkout@v4

      - name: "🐍📥"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TOOL_CACHE 'ELPython\3.12.10'
          $exe = Join-Path $dir 'python.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            $zip = Join-Path $env:RUNNER_TEMP 'python.zip'
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip' -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          }
          & $exe -c "import sys; assert sys.version_info[:2] == (3, 12)"

      - name: "🦙🔍"
        shell: powershell
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          $exe = Join-Path $env:RUNNER_TOOL_CACHE 'ELPython\3.12.10\python.exe'
          & $exe -c "import json,urllib.request; u='http://127.0.0.1:11434/api/tags'; d=json.load(urllib.request.urlopen(u,timeout=5)); names=[m.get('name','') for m in d.get('models',[])]; assert 'qwen2.5vl:7b' in names; print(chr(0x2705)+chr(0x1F999)+chr(0x1F441)+chr(0xFE0F)+'7')"

      - name: "🦙🔋"
        shell: powershell
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          $exe = Join-Path $env:RUNNER_TOOL_CACHE 'ELPython\3.12.10\python.exe'
          & $exe -c "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:11434/api/ps',timeout=5)); names=[m.get('name','') for m in d.get('models',[])]; ok='qwen2.5vl:7b' in names; print((chr(0x2705) if ok else chr(0x1F7E1))+chr(0x1F999)+(chr(0x1F50B) if ok else chr(0x1FAAB)))"
        continue-on-error: true

      - name: "🧪🦙"
        shell: powershell
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          $exe = Join-Path $env:RUNNER_TOOL_CACHE 'ELPython\3.12.10\python.exe'
          & $exe -c "import pathlib,runpy; a=chr(0x1F9EA); b=chr(0x1F999); p=next(x for x in pathlib.Path('.').rglob('*') if x.is_file() and x.name==b and x.parent.name==a); runpy.run_path(str(p),run_name='__main__')"

      - name: "🧪🤖"
        shell: powershell
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          $exe = Join-Path $env:RUNNER_TOOL_CACHE 'ELPython\3.12.10\python.exe'
          $script = Join-Path $env:RUNNER_TEMP 'el_bot_stdin_test.py'
          @'
          import pathlib
          import subprocess
          import sys

          bot_name = chr(0x1F916)
          bot = next(path for path in pathlib.Path('.').iterdir() if path.is_file() and path.name == bot_name)
          source = chr(0x1F525) + chr(0x27A1) + chr(0xFE0F) + chr(0x1F680)
          result = subprocess.run([sys.executable, str(bot)], input=source, text=True, capture_output=True, encoding='utf-8', timeout=20)
          output = result.stdout.strip()
          print(output)
          assert result.returncode == 0
          assert output
          assert not output.startswith(chr(0x274C))
          '@ | Set-Content -LiteralPath $script -Encoding UTF8
          & $exe $script

      - name: "🧪🔀"
        shell: powershell
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          $exe = Join-Path $env:RUNNER_TOOL_CACHE 'ELPython\3.12.10\python.exe'
          & $exe -c "import pathlib,runpy; a=chr(0x1F9EA); b=chr(0x1F500); p=next(x for x in pathlib.Path('.').rglob('*') if x.is_file() and x.name==b and x.parent.name==a); runpy.run_path(str(p),run_name='__main__')"

      - name: "🧪📸"
        shell: powershell
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          $exe = Join-Path $env:RUNNER_TOOL_CACHE 'ELPython\3.12.10\python.exe'
          $script = Join-Path $env:RUNNER_TEMP 'el_vision_test.py'
          @'
          import pathlib
          import subprocess
          import sys
          import unicodedata

          jpeg = ''
          value = 'data:image/jpeg;base64,' + jpeg
          camera = chr(0x1F4F8)
          yellow = chr(0x1F7E1)
          llama = chr(0x1F999)
          vision = next(path for path in pathlib.Path('.').rglob('*') if path.is_file() and path.name == camera and path.parent.name == camera)
          result = subprocess.run([sys.executable, str(vision)], input='2\n' + value, text=True, capture_output=True, encoding='utf-8', timeout=360)
          output = result.stdout.strip()
          print(output)
          if result.stderr.strip(): print(result.stderr.strip())
          assert result.returncode == 0
          assert output
          assert not output.startswith(chr(0x274C))
          assert not output.startswith(yellow + camera + llama)
          assert not any(unicodedata.category(ch).startswith('L') for ch in output)
          '@ | Set-Content -LiteralPath $script -Encoding UTF8
          & $exe $script

      - name: "🧪↔️"
        shell: powershell
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          $exe = Join-Path $env:RUNNER_TOOL_CACHE 'ELPython\3.12.10\python.exe'
          $script = Join-Path $env:RUNNER_TEMP 'el_bidirectional_acceptance.py'
          @'
          import pathlib
          import subprocess
          import sys
          import unicodedata

          bidi = chr(0x2194) + chr(0xFE0F)
          cross = chr(0x274C)
          yellow = chr(0x1F7E1)
          red = chr(0x1F534)
          timer = chr(0x23F1) + chr(0xFE0F)
          refresh = chr(0x1F504)
          black_heart = chr(0x1F5A4)
          chart = chr(0x1F4CA)
          lightning = chr(0x26A1)
          growth = chr(0x1F4C8)
          snail = chr(0x1F40C)
          bidi_file = next(path for path in pathlib.Path('.').rglob('*') if path.is_file() and path.name == bidi and path.parent.name == bidi)

          def run(mode, source):
              result = subprocess.run([sys.executable, str(bidi_file)], input=str(mode) + '\n' + source, text=True, capture_output=True, encoding='utf-8', timeout=420)
              assert result.returncode == 0
              output = result.stdout.strip()
              print(str(mode) + ': ' + output)
              assert output
              assert not output.startswith(cross)
              assert not output.startswith(yellow)
              return output

          test1 = '[Critical error: The database connection timed out after 30 seconds. The local server crashed and went offline. Please restart the docker container immediately to restore the service.]'
          out1 = run(2, test1)
          assert not any(unicodedata.category(ch).startswith('L') for ch in out1)
          assert cross in out1 or red in out1
          assert timer in out1 or '30' in out1
          assert refresh in out1

          test2 = '\U0001F4E6\U0001F501\u2B07\uFE0F. \U0001F433\U0001F3D7\uFE0F\U0001F680. \U0001F310\U0001F50C\u27A1\uFE0F\U0001F512\U0001F4E1. \u274C\U0001F510. \u26A0\uFE0F\U0001F534\u27A1\uFE0F\U0001F527\U0001F6E1\uFE0F\U0001F511.'
          out2 = run(1, test2)
          assert any(unicodedata.category(ch).startswith('L') for ch in out2)

          test3 = '[Add a dark mode toggle button to the main dashboard navigation bar. Also, optimize the page loading speed so that the dashboard renders instantly without lag.]'
          out3 = run(2, test3)
          assert not any(unicodedata.category(ch).startswith('L') for ch in out3)
          assert black_heart in out3
          assert chart in out3
          assert any(mark in out3 for mark in (lightning, growth, snail))
          '@ | Set-Content -LiteralPath $script -Encoding UTF8
          & $exe $script

      - name: "🧪⚡"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $spark = [char]::ConvertFromUtf32(0x26A1)
          $plug = [char]::ConvertFromUtf32(0x1F50C)
          $screen = [char]::ConvertFromUtf32(0x1F5A5) + [char]0xFE0F
          $dir = Join-Path (Get-Location) $spark
          $main = Join-Path $dir $spark
          $preload = Join-Path $dir $plug
          $view = Join-Path $dir $screen

          $nodeCommand = Get-Command node -ErrorAction SilentlyContinue
          if ($nodeCommand) { $node = $nodeCommand.Source } else {
            $runnerRoot = Split-Path (Split-Path $env:RUNNER_TEMP -Parent) -Parent
            $node = Join-Path $runnerRoot 'externals\node24\bin\node.exe'
            if (-not (Test-Path -LiteralPath $node)) { $node = Join-Path $runnerRoot 'externals\node20\bin\node.exe' }
          }

          if (-not (Test-Path -LiteralPath $node)) { throw 'node missing' }
          & $node --check $main
          & $node --check $preload
          if (-not (Test-Path -LiteralPath $view)) { throw 'view missing' }
          if ((Get-Item -LiteralPath $view).Length -lt 100) { throw 'view empty' }
          $html = Get-Content -LiteralPath $view -Raw -Encoding UTF8
          if (-not $html.Contains('id="mode1"')) { throw 'mode1 missing' }
          if (-not $html.Contains('id="mode2"')) { throw 'mode2 missing' }
          if (-not $html.Contains('id="image"')) { throw 'vision missing' }
          if (-not $html.Contains('id="altToggle"')) { throw 'alternatives missing' }
          if (-not $html.Contains("event.key==='Enter' && !event.shiftKey")) { throw 'enter run missing' }
          if (-not $html.Contains('main{width:100%')) { throw 'full width missing' }
          if ($html.Contains('width:min(1160px,100%)')) { throw 'fixed width remains' }
          if (-not $html.Contains('async function chooseAlternative(value)')) { throw 'selection function missing' }
          if (-not $html.Contains('lastSource,value')) { throw 'selection persistence missing' }
          Write-Output ([char]::ConvertFromUtf32(0x2705) + $spark + $screen)

      - name: "🧪"
        shell: powershell
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          $exe = Join-Path $env:RUNNER_TOOL_CACHE 'ELPython\3.12.10\python.exe'
          & $exe -c "import pathlib,runpy; p=next(x for x in pathlib.Path('.').rglob('*') if x.name==chr(0x2705)); runpy.run_path(str(p), run_name='__main__')"

      - name: "🚀"
        shell: powershell
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          $exe = Join-Path $env:RUNNER_TOOL_CACHE 'ELPython\3.12.10\python.exe'
          & $exe -c "import pathlib,runpy; p=next(x for x in pathlib.Path('.').rglob('*') if x.name==chr(0x1F680)); runpy.run_path(str(p), run_name='__main__')"
