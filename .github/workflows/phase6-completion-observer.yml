name: "🔍 Phase 6 Completion Observer"

on:
  workflow_run:
    workflows: ["🚀 Phase 6 Step 5 Proof + Packaging + Release"]
    types: [requested, in_progress, completed]

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  report-run:
    runs-on: ubuntu-latest
    steps:
      - name: "🔍 Publish exact run status + diagnostics"
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            let jobs = [];
            try {
              jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner,
                repo,
                run_id: run.id,
                per_page: 100,
              });
            } catch (error) {
              core.warning(`Could not list jobs yet: ${error.message}`);
            }
            const jobSummary = jobs.map(job => ({
              id: job.id,
              name: job.name,
              status: job.status,
              conclusion: job.conclusion,
              non_success_steps: (job.steps || [])
                .filter(step => step.conclusion && step.conclusion !== 'success' && step.conclusion !== 'skipped')
                .map(step => ({ number: step.number, name: step.name, conclusion: step.conclusion })),
            }));
            const title = `[Phase 6 Completion Run] ${run.head_sha}`;
            const body = [
              '# Phase 6 and Forgey-Insta:EL-Bot v1.0.0 Completion — automatic run evidence',
              '',
              `- workflow: ${run.name}`,
              `- run_id: ${run.id}`,
              `- run_number: ${run.run_number}`,
              `- run_attempt: ${run.run_attempt}`,
              `- event: ${run.event}`,
              `- branch: ${run.head_branch}`,
              `- head_sha: ${run.head_sha}`,
              `- status: ${run.status}`,
              `- conclusion: ${run.conclusion || 'pending'}`,
              `- observed_action: ${context.payload.action}`,
              `- url: ${run.html_url}`,
              '',
              '## Jobs',
              '```json',
              JSON.stringify(jobSummary, null, 2),
              '```',
              '',
              'Machine-generated so exact main push runs can be inspected without Owner screenshots.',
            ].join('\n');
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              per_page: 100,
            });
            const match = existing.find(issue => issue.title === title);
            if (match) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: match.number,
                body,
                state: run.status === 'completed' && run.conclusion === 'success' ? 'closed' : 'open',
              });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
