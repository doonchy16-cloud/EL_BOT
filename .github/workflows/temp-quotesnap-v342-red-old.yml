name: TEMP QuoteSnap V3.4.2 RED tests OLD
on:
  push:
    branches: ['deploy/quotesnap-v342-20260909']
    paths: ['.github/workflows/temp-quotesnap-v342-red-old.yml']
permissions:
  contents: read
jobs:
  red:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Prove V3.4.1 fails V3.4.2 session and UI contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'EL-bot-win'){throw "WRONG_RUNNER=$env:RUNNER_NAME MACHINE=$env:COMPUTERNAME"}
          $root='D:\QuoteSnap\AI\V3.3_AIO'
          $py=Join-Path $env:LOCALAPPDATA 'QuoteSnap\Runtime\venv\Scripts\python.exe'
          $test=Join-Path $env:RUNNER_TEMP 'test_v342_red.py'
          @'
          import sys
          from pathlib import Path
          import pytest
          sys.path.insert(0, r"D:\QuoteSnap\AI\V3.3_AIO")
          from Engines.cluster.control_plane import CoordinatorControlPlane
          from Engines.cluster.coordinator import WorkerSession, _validate_round_frame
          from Engines.ui.aio_dashboard import APP_TITLE, APP_VERSION, build_frame, strip_ansi

          class DummyConn:
              def shutdown(self, *a, **k): pass
              def close(self): pass

          def make_session(node, sid, host, speed=3.0):
              s=WorkerSession(conn=DummyConn(),addr=("192.168.1.2",1234),max_payload=1024)
              s.cluster_id="quotesnap-main"; s.session_id=sid; s.epoch=8; s.node_id=node; s.hostname=host
              s.transport="LAN"; s.software_version="3.4.2"; s.remote_steps_per_second=speed
              s.state="TRAINING"; s.active_round_id="BASE-000067500-000018"; s.local_window_step=70
              s.assigned_steps=329 if node=="doonchyscomputi" else 284
              s.assigned_examples=s.assigned_steps*128
              s.canonical_step=67500
              return s

          def test_coordinator_snapshot_has_instance_and_no_aliased_worker_session(tmp_path):
              cfg={"cluster_id":"quotesnap-main","tcp_port":48571,"udp_discovery_port":0,"expected_worker_count":2}
              cp=CoordinatorControlPlane(cfg,{},"3.4.2",tmp_path,hostname="DESKTOP-V9SCI9V")
              cp.epoch=8; cp.coordinator_instance_id="coord-1234567890"
              a=make_session("doonchyscomputi","main-session","MAIN")
              b=make_session("msi","msi-session","MSI")
              cp._registry.admit(a); cp._registry.admit(b)
              snap=cp.snapshot()
              assert snap["coordinator_instance_id"]=="coord-1234567890"
              assert "session_id" not in snap
              assert "peer" not in snap
              assert "worker_hostname" not in snap
              assert snap["expected_worker_count"]==2
              assert {w["session_id"] for w in snap["workers"]}=={"main-session","msi-session"}
              assert snap["cluster_sync"]["sessions_unique"] is True
              assert snap["cluster_sync"]["epoch_match"] is True

          def test_distinct_worker_sessions_are_valid_and_wrong_session_is_rejected():
              a=make_session("doonchyscomputi","main-session","MAIN")
              b=make_session("msi","msi-session","MSI")
              for s in (a,b):
                  _validate_round_frame(s,{"cluster_id":"quotesnap-main","epoch":8,"session_id":s.session_id,"round_id":"R"},cluster_id="quotesnap-main",round_id="R")
              with pytest.raises(Exception,match="session mismatch"):
                  _validate_round_frame(b,{"cluster_id":"quotesnap-main","epoch":8,"session_id":"main-session","round_id":"R"},cluster_id="quotesnap-main",round_id="R")

          def test_coordinator_overview_is_cluster_first_not_first_worker_session():
              state={"stage":"BASE","status":"TRAINING","stage_step":67500,"stage_examples":8640000,"stage_target_examples":1000000000,"loss":0.073427,"steps_per_second":1.22,"effective_batch":128,"local_window_step":31,"local_window_target_examples":17536}
              cluster={"role":"COORDINATOR","control_state":"ROUND_TRAINING","cluster_id":"quotesnap-main","coordinator_instance_id":"coord-1234567890","epoch":8,"round":"BASE-000067500-000018","canonical_step":67500,"fallback":False,"configured_primary":"DESKTOP_v9sci9v","local_hostname":"DESKTOP-V9SCI9V","authority_match":True,"expected_role":"COORDINATOR","expected_worker_count":2,"coordinator":{"assigned_steps":137,"local_window_step":31,"steps_per_second":1.22},"cluster_sync":{"status":"VERIFIED","workers_active":2,"workers_expected":2,"sessions_unique":True,"epoch_match":True,"round_match":True,"canonical_match":True},"workers":[{"hostname":"MAIN","node_id":"doonchyscomputi","session_id":"main-session","state":"TRAINING","transport":"LAN","peer":"192.168.1.174:1","local_window_step":70,"assigned_steps":329,"steps_per_second":3.3,"last_heartbeat_age_seconds":0.6},{"hostname":"MSI","node_id":"msi","session_id":"msi-session","state":"TRAINING","transport":"LAN","peer":"192.168.1.6:1","local_window_step":70,"assigned_steps":284,"steps_per_second":3.1,"last_heartbeat_age_seconds":0.7}]}
              text=strip_ansi(build_frame(state,{},cluster,{"free_gb":400},"x.log"))
              assert "V3.4.2" in text
              assert "Coordinator ID" in text
              assert "CLUSTER SYNC" in text and "VERIFIED" in text
              assert "main-session" not in text.split("CURRENT ROUND")[0]
              assert "137" in text and "329" in text and "284" in text

          def test_worker_overview_is_assignment_first_and_names_own_session():
              state={"stage":"BASE","status":"TRAINING","stage_step":67500,"stage_examples":8640000,"stage_target_examples":1000000000,"loss":0.073427,"steps_per_second":3.3188,"effective_batch":128,"local_window_step":150,"local_window_examples":19200,"local_window_target_examples":42112}
              cluster={"role":"WORKER","control_state":"TRAINING","cluster_id":"quotesnap-main","coordinator_hostname":"DESKTOP-V9SCI9V","coordinator_instance_id":"coord-1234567890","epoch":8,"worker_session_id":"main-session","session_id":"main-session","round":"BASE-000067500-000018","canonical_step":67500,"assignment_steps":329,"assignment_examples":42112,"local_window_step":150,"fallback":False,"transport":"LAN","peer":"192.168.1.110","configured_primary":"DESKTOP_v9sci9v","local_hostname":"DOONCHYSCOMPUTI","authority_match":False,"expected_role":"WORKER"}
              text=strip_ansi(build_frame(state,{"name":"RTX 5070","used":"4049","total":"8151","util":"95","temp":"76","power":"61.4"},cluster,{"free_gb":1726},"x.log"))
              assert "CURRENT ASSIGNMENT" in text
              assert "Assigned" in text and "329 steps" in text
              assert "Progress" in text and "150 / 329" in text
              assert "My session" in text and "main-session" in text
              assert "Authority match: NO" not in text
              assert "Coordinator" in text and "DESKTOP-V9SCI9V" in text

          def test_software_identity_is_v342():
              assert APP_VERSION=="3.4.2"
              assert "V3.4.2" in APP_TITLE
          '@ | Set-Content -LiteralPath $test -Encoding UTF8
          Push-Location $root
          try {
            $env:PYTHONDONTWRITEBYTECODE='1'
            & $py -m pytest -q -p no:cacheprovider $test
            $rc=$LASTEXITCODE
          } finally { Pop-Location }
          if($rc -eq 0){throw 'RED_GATE_FAILED_TESTS_UNEXPECTEDLY_PASSED'}
          Write-Host "V342_RED_GATE_PASS expected_failures_observed exit=$rc"
