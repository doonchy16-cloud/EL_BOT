name: Start QuoteSnap V3.3 OLD-PC only

on:
  push:
    paths:
      - '.github/workflows/quotesnap-start-oldpc-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  start:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Start OLD-PC trainer only and verify
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ine 'DESKTOP-V9SCI9V'){ throw "REFUSING_NON_OLDPC machine=$env:COMPUTERNAME runner=$env:RUNNER_NAME" }
          $root='D:\QuoteSnap\AI\V3.3_AIO'
          $py=Join-Path $env:LOCALAPPDATA 'QuoteSnap\Runtime\venv\Scripts\python.exe'
          $dashboard=Join-Path $root 'Engines\ui\aio_dashboard.py'
          $cp=Join-Path $root 'Checkpoints\base\quotesnap_base_step_000010000.pt'
          Write-Host "RUNNER=$env:RUNNER_NAME MACHINE=$env:COMPUTERNAME ROOT=$root"
          foreach($p in @($root,$py,$dashboard,$cp)){ if(-not(Test-Path -LiteralPath $p)){ throw "MISSING=$p" } }
          $cpHash=(Get-FileHash -LiteralPath $cp -Algorithm SHA256).Hash
          Write-Host "STEP10000_HASH=$cpHash"
          if($cpHash -ne '1D52AF1451F6D8FF0B7CFE1577E2325EA6DD341DCA0E4CA7D0A9E68CEEB97D3D'){ throw 'STEP10000_HASH_CHANGED' }
          $existing=Get-CimInstance Win32_Process | Where-Object { $_.Name -match '^(python|pythonw|powershell|pwsh|cmd)\.exe$' -and $_.CommandLine -and $_.CommandLine -match 'D:\\QuoteSnap\\AI\\V3\.3_AIO|aio_orchestrator\.py|aio_dashboard\.py' }
          if($existing){
            Write-Host '=== EXISTING QUOTESNAP PROCESSES ==='
            $existing | Select-Object ProcessId,ParentProcessId,Name,CommandLine | Format-List
            throw 'REFUSING_DUPLICATE_TRAINER'
          }
          $oldTracking=$env:RUNNER_TRACKING_ID
          try {
            $env:RUNNER_TRACKING_ID=''
            Start-Process -FilePath $py -ArgumentList @('-u',$dashboard) -WorkingDirectory $root
          } finally {
            $env:RUNNER_TRACKING_ID=$oldTracking
          }
          Start-Sleep -Seconds 12
          $live=Get-CimInstance Win32_Process | Where-Object { $_.Name -match '^python(w)?\.exe$' -and $_.CommandLine -and $_.CommandLine -match 'D:\\QuoteSnap\\AI\\V3\.3_AIO|aio_orchestrator\.py|aio_dashboard\.py' }
          Write-Host '=== LIVE AFTER START ==='
          if(-not $live){ throw 'QUOTESNAP_OLDPC_NOT_RUNNING_AFTER_START' }
          $live | Select-Object ProcessId,ParentProcessId,Name,CommandLine | Format-List
          $status=Join-Path $root 'State\cluster_status.json'
          if(-not(Test-Path -LiteralPath $status)){ throw 'CLUSTER_STATUS_MISSING_AFTER_START' }
          $raw=Get-Content -LiteralPath $status -Raw
          Write-Host "CLUSTER_STATUS=$raw"
          $s=$raw | ConvertFrom-Json
          if(([string]$s.role).ToUpperInvariant() -ne 'COORDINATOR'){ throw "ROLE_NOT_COORDINATOR=$($s.role)" }
          if($s.authority_match -ne $true){ throw "AUTHORITY_NOT_TRUE=$($s.authority_match)" }
          if(([string]$s.local_hostname).ToUpperInvariant() -ne 'DESKTOP-V9SCI9V'){ throw "WRONG_STATUS_HOST=$($s.local_hostname)" }
          Write-Host 'QUOTESNAP_OLDPC_ONLY_START_VERIFIED'
