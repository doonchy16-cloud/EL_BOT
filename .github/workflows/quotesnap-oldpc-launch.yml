name: QuoteSnap V3.3 OLD-PC launch

on:
  push:
    paths:
      - '.github/workflows/quotesnap-oldpc-launch.yml'

jobs:
  verify_oldpc:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 2
    steps:
      - name: Snapshot OLD-PC coordinator
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='D:\QuoteSnap\AI\V3.3_AIO'
          if($env:RUNNER_NAME -ne 'EL-bot-win'){ throw "WRONG_RUNNER=$env:RUNNER_NAME" }
          if($env:COMPUTERNAME -ne 'DESKTOP-V9SCI9V'){ throw "WRONG_MACHINE=$env:COMPUTERNAME" }
          Start-Sleep -Seconds 2
          $s=Get-Content "$root\State\cluster_status.json" -Raw | ConvertFrom-Json
          Write-Host "STATUS role=$($s.role) host=$($s.local_hostname) authority=$($s.authority_match) epoch=$($s.epoch) session=$($s.session_id) fallback=$($s.fallback) peer=$($s.peer) transport=$($s.transport) round=$($s.round) canonical=$($s.canonical_step) last_merge=$($s.last_merge)"
          $hostkey=(([string]$s.local_hostname).ToLowerInvariant() -replace '[^a-z0-9]','')
          if($s.role -ne 'COORDINATOR' -or $s.authority_match -ne $true -or $hostkey -ne 'desktopv9sci9v'){ throw 'OLDPC_ROLE_INVALID' }
          $log=Get-ChildItem "$root\Logs\training_*.log" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Write-Host "LATEST_LOG=$($log.FullName)"
          Get-Content $log.FullName -Tail 80 | Select-String 'cluster_identity|cluster_role|worker|session|round|merge|fallback|READY' | Select-Object -Last 25
          Write-Host 'OLDPC_CLUSTER_SNAPSHOT_PASS'
