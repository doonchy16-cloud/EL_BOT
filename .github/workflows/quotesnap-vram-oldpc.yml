name: QuoteSnap VRAM OLD-PC live benchmark diagnostic
on:
  push:
    paths: ['.github/workflows/quotesnap-vram-oldpc.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect benchmark process and GPU
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ine 'DESKTOP-V9SCI9V'){throw "WRONG_MACHINE=$env:COMPUTERNAME RUNNER=$env:RUNNER_NAME"}
          Write-Host "RUNNER=$env:RUNNER_NAME COMPUTER=$env:COMPUTERNAME"
          Write-Host '=== PYTHON PROCESSES ==='
          Get-CimInstance Win32_Process | Where-Object { $_.Name -match '^python(.exe)?$' } | Select-Object ProcessId,ParentProcessId,CommandLine | Format-List
          Write-Host '=== GPU 6s ==='
          1..6 | ForEach-Object { $s=& nvidia-smi --query-gpu=name,memory.used,memory.free,utilization.gpu,utilization.memory,pstate,power.draw --format=csv,noheader,nounits; Write-Host "$(Get-Date -Format o) | $s"; Start-Sleep 1 }
          Write-Host '=== GPU APPS ==='
          & nvidia-smi --query-compute-apps=pid,process_name,used_memory --format=csv,noheader,nounits
