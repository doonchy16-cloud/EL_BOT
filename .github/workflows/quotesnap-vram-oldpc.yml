name: QuoteSnap OLD-PC launch-chain diagnostic
on:
  push:
    paths: ['.github/workflows/quotesnap-vram-oldpc.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - name: Trace BAT, PowerShell, dashboard, status, and latest logs
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ine 'DESKTOP-V9SCI9V'){throw "WRONG_MACHINE=$env:COMPUTERNAME RUNNER=$env:RUNNER_NAME"}
          $root='D:\QuoteSnap\AI\V3.3_AIO'
          Write-Host "RUNNER=$env:RUNNER_NAME MACHINE=$env:COMPUTERNAME NOW=$(Get-Date -Format o)"
          Write-Host '=== MATCHING PROCESS TREE ==='
          Get-CimInstance Win32_Process |
            Where-Object { $_.Name -match 'python|powershell|pwsh|cmd|conhost' -and ($_.CommandLine -match 'QuoteSnap|V3\.3_AIO|aio_launcher|Launch_training') } |
            Select-Object ProcessId,ParentProcessId,Name,CreationDate,CommandLine | Format-List
          Write-Host '=== STATUS ==='
          $status=Join-Path $root 'State\cluster_status.json'
          if(Test-Path $status){$i=Get-Item $status;Write-Host "MTIME=$($i.LastWriteTime.ToString('o')) AGE_S=$([math]::Round(((Get-Date)-$i.LastWriteTime).TotalSeconds,1))";Get-Content $status -Raw}else{Write-Host 'STATUS_MISSING'}
          Write-Host '=== LATEST LOG FILES ==='
          Get-ChildItem "$root\Logs" -File -ErrorAction SilentlyContinue|Sort-Object LastWriteTime -Descending|Select-Object -First 8 Name,Length,LastWriteTime|Format-Table -AutoSize
          $logs=Get-ChildItem "$root\Logs" -File -ErrorAction SilentlyContinue|Sort-Object LastWriteTime -Descending|Select-Object -First 3
          foreach($log in $logs){Write-Host "--- $($log.FullName) ---";Get-Content $log.FullName -Tail 160 -ErrorAction SilentlyContinue}
          Write-Host '=== LAUNCHER/BAT HASHES ==='
          Get-FileHash "$root\Launch_training.bat","$root\Runtime\bootstrap\aio_launcher.ps1","$root\Engines\ui\aio_dashboard.py","$root\Engines\orchestrator\aio_orchestrator.py" -Algorithm SHA256|Format-Table Path,Hash -AutoSize
          Write-Host '=== GPU ==='
          & nvidia-smi --query-gpu=name,memory.used,memory.free,utilization.gpu,power.draw --format=csv,noheader,nounits
          Write-Host 'OLDPC_LAUNCH_CHAIN_DIAG_COMPLETE'
          # verification trigger 2026-09-09T09:23Z
