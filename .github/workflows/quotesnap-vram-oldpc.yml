name: QuoteSnap VRAM OLD-PC
on:
  push:
    paths: ['.github/workflows/quotesnap-vram-oldpc.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: GPU + trainer diagnostic
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'EL-bot-win'){ throw "WRONG_RUNNER=$env:RUNNER_NAME" }
          $root='D:\QuoteSnap\AI\V3.3_AIO'
          Write-Host "RUNNER=$env:RUNNER_NAME COMPUTER=$env:COMPUTERNAME ROOT=$root"
          if(Test-Path "$root\State\cluster_status.json"){Write-Host '=== CLUSTER STATUS ===';Get-Content "$root\State\cluster_status.json"}
          Write-Host '=== LATEST CHECKPOINTS ==='
          Get-ChildItem "$root\Checkpoints\base\quotesnap_base_step_*.pt" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 5 Name,Length,LastWriteTime | Format-Table -AutoSize
          Write-Host '=== NVIDIA 6s ==='
          1..6 | ForEach-Object { $s=& nvidia-smi --query-gpu=memory.used,memory.free,utilization.gpu,utilization.memory,power.draw --format=csv,noheader,nounits; Write-Host "$(Get-Date -Format o) | $s"; Start-Sleep 1 }
