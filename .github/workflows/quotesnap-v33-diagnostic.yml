name: QuoteSnap V3.3 diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/quotesnap-v33-diagnostic.yml'
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Initialize OLD-PC root ownership marker
        shell: powershell
        run: |
          $root='D:\QuoteSnap\AI\V3.3_AIO'
          $state=Join-Path $root 'State'
          $marker=Join-Path $state 'root_owner.json'
          if($env:COMPUTERNAME -ne 'DESKTOP-V9SCI9V'){ throw "WRONG_MACHINE=$env:COMPUTERNAME" }
          New-Item -ItemType Directory -Force -Path $state | Out-Null
          $expected=[ordered]@{version=1;node_id='desktopv9sci9v';hostname='DESKTOP-V9SCI9V';root='D:\QuoteSnap\AI\V3.3_AIO'}
          if(Test-Path -LiteralPath $marker){
            $existing=Get-Content -LiteralPath $marker -Raw | ConvertFrom-Json
            if(([string]$existing.node_id).ToLowerInvariant() -ne 'desktopv9sci9v'){ throw "ROOT_OWNER_CONFLICT=$($existing.node_id)" }
            Write-Host "ROOT_OWNER_ALREADY_CORRECT=$($existing.node_id)"
          } else {
            $json=$expected | ConvertTo-Json -Compress
            [System.IO.File]::WriteAllText($marker,$json+[Environment]::NewLine,[System.Text.UTF8Encoding]::new($false))
            Write-Host 'ROOT_OWNER_CREATED=desktopv9sci9v'
          }
          Get-Content -LiteralPath $marker
      - name: Verify evidence remains intact
        shell: powershell
        run: |
          $root='D:\QuoteSnap\AI\V3.3_AIO'
          Write-Host "RUNNER=$env:RUNNER_NAME COMPUTER=$env:COMPUTERNAME ROOT=$(Test-Path $root)"
          Write-Host '=== ROLE EVIDENCE ==='
          Get-Content "$root\Logs\training_20260908_190355.log" | Select-String 'cluster_identity|cluster_role'
          Get-Content "$root\Logs\training_20260908_190445.log" | Select-String 'cluster_identity|cluster_role'
          Write-Host '=== ROOT OWNER ==='
          Get-Content "$root\State\root_owner.json"
