name: QuoteSnap V3.3 diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/quotesnap-v33-diagnostic.yml'
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect QuoteSnap V3.3 local evidence
        shell: powershell
        run: |
          $root='D:\QuoteSnap\AI\V3.3_AIO'
          Write-Host "RUNNER=$env:RUNNER_NAME COMPUTER=$env:COMPUTERNAME ROOT=$(Test-Path $root)"
          Write-Host '=== LOG DIRECTORY ==='
          Get-ChildItem "$root\Logs\training_*.log" | Sort-Object LastWriteTime | Select-Object Name,Length,CreationTime,LastWriteTime | Format-Table -AutoSize
          Write-Host '=== 190355 ROLE ==='
          if(Test-Path "$root\Logs\training_20260908_190355.log"){Get-Content "$root\Logs\training_20260908_190355.log" | Select-String 'cluster_identity|cluster_role|resolved_role|authority_match'}
          Write-Host '=== 190445 ROLE ==='
          if(Test-Path "$root\Logs\training_20260908_190445.log"){Get-Content "$root\Logs\training_20260908_190445.log" | Select-String 'cluster_identity|cluster_role|resolved_role|authority_match'}
          Write-Host '=== CURRENT STATE ==='
          if(Test-Path "$root\State\cluster_status.json"){Get-Content "$root\State\cluster_status.json"}
          Write-Host '=== PATH IDENTITY ==='
          Get-Item $root | Select-Object FullName,Attributes,LinkType,Target | Format-List
          Get-PSDrive D | Format-List Name,Root,DisplayRoot,Provider
