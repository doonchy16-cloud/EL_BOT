name: "⚡ Phase 6 Step 4 Runtime + Control Room Validation"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "phase6-step4-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  step4:
    name: "⚡🤖 Forgey Primary + Hidden Control Room"
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 130
    steps:
      - name: "📥 Source"
        uses: actions/checkout@v4

      - name: "🐍 Python 3.12"
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TOOL_CACHE 'ELPython\3.12.10';$exe=Join-Path $dir 'python.exe'
          if(-not(Test-Path $exe)){$zip=Join-Path $env:RUNNER_TEMP 'python.zip';New-Item -ItemType Directory -Force -Path $dir|Out-Null;Invoke-WebRequest -UseBasicParsing -Uri 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip' -OutFile $zip;Expand-Archive $zip $dir -Force}
          $pth=Join-Path $dir 'python312._pth';if(Test-Path $pth){$t=Get-Content $pth -Raw;if($t -match '#import site'){$t=$t -replace '#import site','import site';[IO.File]::WriteAllText($pth,$t,[Text.UTF8Encoding]::new($false))}}
          & $exe -c "import sys;assert sys.version_info[:2]==(3,12);print(sys.version)";"EL_PYTHON=$exe"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: "📖 Materialize knowledge"
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File 'scripts\materialize-phase6-step1-knowledge.ps1'

      - name: "🔥 PyTorch 2.13 CPU"
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$torchDir=Join-Path $env:RUNNER_TOOL_CACHE 'ELTorch\2.13.0-cp312';$marker=Join-Path $torchDir '.ready'
          if(-not(Test-Path $marker)){if(Test-Path $torchDir){Remove-Item $torchDir -Recurse -Force};New-Item -ItemType Directory -Force -Path $torchDir|Out-Null;$pipDir=Join-Path $env:RUNNER_TOOL_CACHE 'ELPip';$pipz=Join-Path $pipDir 'pip.pyz';New-Item -ItemType Directory -Force -Path $pipDir|Out-Null;if(-not(Test-Path $pipz)){Invoke-WebRequest -UseBasicParsing -Uri 'https://bootstrap.pypa.io/pip/pip.pyz' -OutFile $pipz};& $env:EL_PYTHON $pipz install --disable-pip-version-check --only-binary=:all: --target $torchDir -r 'requirements-phase6-step2.txt';if($LASTEXITCODE-ne 0){throw 'TORCH_INSTALL_FAILED'};Set-Content $marker 'ready' -Encoding ASCII}
          $pyDir=Split-Path -Parent $env:EL_PYTHON;$pth=Join-Path $pyDir 'python312._pth';$lines=@(Get-Content $pth|Where-Object{$_ -notmatch 'ELTorch\\'});$lines+=$torchDir;if(-not($lines -contains 'import site')){$lines+='import site'};[IO.File]::WriteAllLines($pth,$lines,[Text.UTF8Encoding]::new($false));& $env:EL_PYTHON -c "import torch;assert torch.__version__.startswith('2.13.0');print(torch.__version__)"

      - name: "🧠👁️ Reconstruct verified multimodal G1"
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$env:PYTHONIOENCODING='utf-8';$step2=Join-Path (Get-Location) 'data\phase6-step2'
          & $env:EL_PYTHON 'scripts\phase6-step2-train-g1.py' --output $step2 --steps 480 --batch-size 28;if($LASTEXITCODE-ne 0){throw 'G1_TRAIN_FAILED'}
          & $env:EL_PYTHON 'scripts\phase6-step2-rehearse-g1.py' --artifact-dir $step2 --steps 240 --batch-size 32;if($LASTEXITCODE-ne 0){throw 'G1_REHEARSE_FAILED'}
          & $env:EL_PYTHON 'scripts\phase6-step2-train-vision.py' --artifact-dir $step2 --steps 360 --batch-size 28;if($LASTEXITCODE-ne 0){throw 'G1_VISION_FAILED'}
          $rocket=[char]::ConvertFromUtf32(0x1F680);$red=[char]::ConvertFromUtf32(0x1F534)
          & $env:EL_PYTHON 'scripts\phase6-step2-infer.py' --artifact-dir $step2 --direction 'ABC_TO_EL' --text 'rocket' --expected $rocket --evidence (Join-Path $step2 'infer-abc-to-el.json');if($LASTEXITCODE-ne 0){throw 'G1_FORWARD_FAILED'}
          & $env:EL_PYTHON 'scripts\phase6-step2-infer.py' --artifact-dir $step2 --direction 'EL_TO_ABC' --text $rocket --expected 'rocket' --evidence (Join-Path $step2 'infer-el-to-abc.json');if($LASTEXITCODE-ne 0){throw 'G1_REVERSE_FAILED'}
          & $env:EL_PYTHON 'scripts\phase6-vision-infer.py' --artifact-dir $step2 --direction 'IMAGE_TO_EL' --fixture-concept 'red-circle' --fixture-seed 9000 --expected $red --evidence (Join-Path $step2 'infer-image-to-el.json');if($LASTEXITCODE-ne 0){throw 'G1_IMAGE_EL_FAILED'}
          & $env:EL_PYTHON 'scripts\phase6-vision-infer.py' --artifact-dir $step2 --direction 'IMAGE_TO_ABC' --fixture-concept 'red-circle' --fixture-seed 9000 --expected 'red circle' --evidence (Join-Path $step2 'infer-image-to-abc.json');if($LASTEXITCODE-ne 0){throw 'G1_IMAGE_ABC_FAILED'}
          & $env:EL_PYTHON 'architecture\verify_phase6_step2_g0_g1.py';if($LASTEXITCODE-ne 0){throw 'G1_AUTHORITY_FAILED'}
          & $env:EL_PYTHON 'architecture\verify_phase6_step2_native_vision.py';if($LASTEXITCODE-ne 0){throw 'G1_VISION_AUTHORITY_FAILED'}

      - name: "🦙👁️ Reconstruct verified teacher + multimodal G2"
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$env:PYTHONIOENCODING='utf-8';$step2=Join-Path (Get-Location) 'data\phase6-step2';$step3=Join-Path (Get-Location) 'data\phase6-step3'
          & $env:EL_PYTHON 'scripts\phase6-step3-teach.py' --output $step3;if($LASTEXITCODE-ne 0){throw 'TEACH_FAILED'}
          & $env:EL_PYTHON 'scripts\phase6-step3-train-g2.py' --step2-artifact $step2 --step3-artifact $step3 --steps 360 --batch-size 40;if($LASTEXITCODE-ne 0){throw 'G2_TRAIN_FAILED'}
          & $env:EL_PYTHON 'scripts\phase6-step3-refresh-vision.py' --step3-artifact $step3 --steps 300 --batch-size 28;if($LASTEXITCODE-ne 0){throw 'G2_VISION_FAILED'}
          & $env:EL_PYTHON 'scripts\phase6-step3-promote.py' --step2-artifact $step2 --step3-artifact $step3;if($LASTEXITCODE-ne 0){throw 'G2_PROMOTE_FAILED'}
          $bicycle=[char]::ConvertFromUtf32(0x1F6B2);$red=[char]::ConvertFromUtf32(0x1F534);$registry=Join-Path $step3 'generation-registry.json'
          & $env:EL_PYTHON 'scripts\phase6-step3-infer-selected.py' --registry $registry --direction 'ABC_TO_EL' --text 'vehicle powered by pedals with two wheels' --expected $bicycle --evidence (Join-Path $step3 'infer-selected-forward.json');if($LASTEXITCODE-ne 0){throw 'G2_FORWARD_EVIDENCE_FAILED'}
          & $env:EL_PYTHON 'scripts\phase6-step3-infer-selected.py' --registry $registry --direction 'EL_TO_ABC' --text $bicycle --expected 'bicycle' --evidence (Join-Path $step3 'infer-selected-reverse.json');if($LASTEXITCODE-ne 0){throw 'G2_REVERSE_EVIDENCE_FAILED'}
          & $env:EL_PYTHON 'scripts\phase6-vision-infer.py' --registry $registry --direction 'IMAGE_TO_EL' --fixture-concept 'red-circle' --fixture-seed 9000 --expected $red --evidence (Join-Path $step3 'infer-selected-image-to-el.json');if($LASTEXITCODE-ne 0){throw 'G2_IMAGE_EL_EVIDENCE_FAILED'}
          & $env:EL_PYTHON 'scripts\phase6-vision-infer.py' --registry $registry --direction 'IMAGE_TO_ABC' --fixture-concept 'red-circle' --fixture-seed 9000 --expected 'red circle' --evidence (Join-Path $step3 'infer-selected-image-to-abc.json');if($LASTEXITCODE-ne 0){throw 'G2_IMAGE_ABC_EVIDENCE_FAILED'}

      - name: "🧪 Step 3 multimodal regression"
        shell: powershell
        run: |
          $env:PYTHONIOENCODING='utf-8'
          & $env:EL_PYTHON 'architecture\verify_phase6_step3_teacher_learning.py';if($LASTEXITCODE-ne 0){throw 'STEP3_REGRESSION_FAILED'}
          & $env:EL_PYTHON 'architecture\verify_phase6_step3_native_vision.py';if($LASTEXITCODE-ne 0){throw 'STEP3_VISION_REGRESSION_FAILED'}

      - name: "🟩 Node 24"
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: "⚡ Forgey primary forward + reverse"
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$env:PYTHONIOENCODING='utf-8';$env:EL_FORGEY_REGISTRY=(Resolve-Path 'data\phase6-step3\generation-registry.json').Path
          node 'scripts\phase6-step4-runtime-proof.js';if($LASTEXITCODE-ne 0){throw 'STEP4_RUNTIME_PROOF_FAILED'}

      - name: "📸👁️ Forgey-first screenshot routing"
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$env:EL_FORGEY_REGISTRY=(Resolve-Path 'data\phase6-step3\generation-registry.json').Path
          powershell -NoProfile -ExecutionPolicy Bypass -File 'scripts\ci-screenshot-vision.ps1' -PythonExe $env:EL_PYTHON
          if($LASTEXITCODE-ne 0){throw 'FORGEY_FIRST_SCREENSHOT_FAILED'}

      - name: "📊 Real AI status snapshot"
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$env:PYTHONIOENCODING='utf-8';$env:EL_FORGEY_REGISTRY=(Resolve-Path 'data\phase6-step3\generation-registry.json').Path
          node 'scripts\phase6-step4-status-proof.js';if($LASTEXITCODE-ne 0){throw 'STEP4_STATUS_PROOF_FAILED'}

      - name: "🔐 Auth proof"
        shell: powershell
        run: node 'scripts\phase6-step4-auth-proof.js' 'data\phase6-step4\auth-proof.json'

      - name: "📦 Electron dependencies"
        shell: powershell
        run: npm install --no-audit --no-fund

      - name: "🕶️ Two-page hidden console proof"
        shell: powershell
        run: |
          $env:EL_FORGEY_REGISTRY=(Resolve-Path 'data\phase6-step3\generation-registry.json').Path;& '.\node_modules\.bin\electron.cmd' 'scripts\phase6-step4-console-proof.js' 'data\phase6-step4\console-proof.json';if($LASTEXITCODE-ne 0){throw 'CONSOLE_PROOF_FAILED'}

      - name: "🧪 Step 4 authority"
        shell: powershell
        run: |
          $env:PYTHONIOENCODING='utf-8';& $env:EL_PYTHON 'architecture\verify_phase6_step4_runtime_console.py';if($LASTEXITCODE-ne 0){throw 'STEP4_AUTHORITY_FAILED'}

      - name: "🧪 Phase 2 + Phase 3 + 44/44"
        shell: powershell
        run: |
          $env:PYTHONIOENCODING='utf-8';& $env:EL_PYTHON 'architecture\verify_phase2_knowledge_foundation.py';if($LASTEXITCODE-ne 0){throw 'PHASE2_FAILED'};& $env:EL_PYTHON 'architecture\verify_phase3_semantic_search.py';if($LASTEXITCODE-ne 0){throw 'PHASE3_FAILED'};& $env:EL_PYTHON -c "import importlib.machinery,importlib.util,pathlib,sys;root=pathlib.Path('.');a=chr(0x1F9EA);p=next(x for x in root.rglob('*') if x.is_file() and x.name==a and x.parent.name==a);l=importlib.machinery.SourceFileLoader('_p6s4_diag',str(p));s=importlib.util.spec_from_loader('_p6s4_diag',l);m=importlib.util.module_from_spec(s);sys.modules['_p6s4_diag']=m;l.exec_module(m);r=m.DiagnosticsEngine().run();print(r.render_el());assert r.passed and len(r.checks)==44"
