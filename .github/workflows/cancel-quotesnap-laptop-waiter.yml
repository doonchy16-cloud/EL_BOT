name: Cancel obsolete QuoteSnap OLD-PC verification runs
on:
  push:
    paths: ['.github/workflows/cancel-quotesnap-laptop-waiter.yml']
permissions:
  contents: read
jobs:
  cancel:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3
    steps:
      - name: Cancel obsolete LPS runs via existing GitHub CLI auth
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Write-Host "RUNNER=$env:RUNNER_NAME MACHINE=$env:COMPUTERNAME"
          $gh=Get-Command gh -ErrorAction SilentlyContinue
          if(-not $gh){throw 'GH_CLI_NOT_INSTALLED'}
          gh auth status
          foreach($id in @(34311827399,34312330132)){
            gh run cancel $id -R doonchy16-cloud/LPS
            if($LASTEXITCODE-ne 0){Write-Host "cancel $id returned $LASTEXITCODE (may already be terminal)"}
          }
          Write-Host 'OBSOLETE_OLDPC_CANCEL_REQUESTS_SENT'
