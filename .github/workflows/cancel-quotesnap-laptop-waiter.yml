name: Cancel pathological QuoteSnap OLD-PC autotune run
on:
  push:
    paths: ['.github/workflows/cancel-quotesnap-laptop-waiter.yml']
permissions:
  contents: read
jobs:
  cancel:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3
    steps:
      - name: Cancel active LPS autotune run via existing GitHub CLI auth
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Write-Host "RUNNER=$env:RUNNER_NAME MACHINE=$env:COMPUTERNAME"
          $gh=Get-Command gh -ErrorAction SilentlyContinue
          if(-not $gh){throw 'GH_CLI_NOT_INSTALLED'}
          gh auth status
          gh run cancel 34312423884 -R doonchy16-cloud/LPS
          if($LASTEXITCODE-ne 0){throw "CANCEL_FAILED=$LASTEXITCODE"}
          Write-Host 'PATHOLOGICAL_AUTOTUNE_CANCEL_REQUEST_SENT'