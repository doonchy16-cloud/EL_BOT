name: "🚀 Phase 6 and Forgey-Insta:EL-Bot v1.0.0 Completion"
run-name: "Phase 6 release transaction — v0.5.0 + v0.6.0 only"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  statuses: write

concurrency:
  group: "phase6-final-release-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  release_guard:
    name: "🔒 Main-only + single-run guard"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "🔒 Cancel other active runs and enforce main-only branches"
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRun = context.runId;
            const active = new Set(['queued', 'in_progress', 'waiting', 'requested', 'pending']);

            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner, repo, per_page: 100
            });
            for (const run of runs) {
              if (run.id === currentRun || !active.has(run.status)) continue;
              try {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                core.info(`cancel requested for other active run ${run.id}`);
              } catch (error) {
                if (![404, 409].includes(error.status)) throw error;
              }
            }

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100
            });
            for (const branch of branches) {
              if (branch.name === 'main') continue;
              await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch.name}` });
              core.info(`deleted non-main branch ${branch.name}`);
            }

            const remaining = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100
            });
            const unexpected = remaining.filter(b => b.name !== 'main').map(b => b.name);
            if (unexpected.length) {
              core.setFailed(`main-only invariant failed: ${unexpected.join(', ')}`);
            } else {
              core.info('MAIN_ONLY_BRANCHES_OK');
            }

  transactional_release:
    name: "🚀 Transactional release: inspect → ensure → verify → clean"
    needs: release_guard
    if: ${{ contains(github.event.head_commit.message, '[release-only]') || github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - name: "📥 Source"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "🟩 Node 24 for v0.6 fallback"
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: "🐍 Bootstrap release Python 3.12.10"
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TOOL_CACHE 'ELPython\3.12.10'
          $exe=Join-Path $dir 'python.exe'
          if(-not(Test-Path -LiteralPath $exe)){
            $zip=Join-Path $env:RUNNER_TEMP 'python-3.12.10-embed.zip'
            New-Item -ItemType Directory -Force -Path $dir|Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip' -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          }
          & $exe -c "import sys;assert sys.version_info[:2]==(3,12);print(sys.version)"
          if($LASTEXITCODE-ne 0){throw 'RELEASE_PYTHON_BOOTSTRAP_FAILED'}
          "EL_RELEASE_PYTHON=$exe"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: "1️⃣🔎 Release preflight snapshot"
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          & $env:EL_RELEASE_PYTHON '.github\release\release_manager.py' preflight
          if($LASTEXITCODE-ne 0){throw 'RELEASE_PREFLIGHT_FAILED'}

      - name: "2️⃣📦 Restore or certify v0.6.0 payload"
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          & $env:EL_RELEASE_PYTHON '.github\release\release_manager.py' prepare-v06
          if($LASTEXITCODE-ne 0){throw 'V06_PAYLOAD_PREPARE_FAILED'}

      - name: "3️⃣🕰️ Ensure preferred v0.5.0 historical release"
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          & $env:EL_RELEASE_PYTHON '.github\release\release_manager.py' ensure-v05
          if($LASTEXITCODE-ne 0){throw 'V05_RELEASE_ENSURE_FAILED'}

      - name: "4️⃣🚀 Ensure exact-main v0.6.0 + 14 assets"
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          & $env:EL_RELEASE_PYTHON '.github\release\release_manager.py' ensure-v06
          if($LASTEXITCODE-ne 0){throw 'V06_RELEASE_ENSURE_FAILED'}

      - name: "5️⃣🧹🔒 Final cleanup + remote invariant verification"
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          & $env:EL_RELEASE_PYTHON '.github\release\release_manager.py' finalize
          if($LASTEXITCODE-ne 0){throw 'FINAL_RELEASE_INVARIANT_FAILED'}

      - name: "🧾 Preserve release transaction state"
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase6-release-transaction-${{ github.sha }}
          path: ${{ runner.temp }}\el-bot-release-state.json
          if-no-files-found: ignore
          retention-days: 14

      - name: "🔒 Record truthful GitHub release verification"
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const statePath = path.join(process.env.RUNNER_TEMP, 'el-bot-release-state.json');
            let state = {};
            try {
              state = JSON.parse(fs.readFileSync(statePath, 'utf8'));
            } catch (_) {}

            const succeeded = '${{ job.status }}' === 'success'
              && state.final
              && state.final.release_count === 2
              && state.final['v0.6.0']
              && state.final['v0.6.0'].assets === 14;

            const releaseUrl = succeeded && state.final['v0.6.0'].url
              ? state.final['v0.6.0'].url
              : runUrl;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: succeeded ? 'success' : 'failure',
              context: 'phase6-release-verification',
              target_url: releaseUrl,
              description: succeeded
                ? 'Verified: exactly v0.5.0 + v0.6.0; v0.6.0 has 14 assets'
                : 'Release transaction incomplete or remote invariant failed',
            });

            core.info(
              succeeded
                ? `PHASE6_RELEASE_STATUS_SUCCESS url=${releaseUrl}`
                : `PHASE6_RELEASE_STATUS_FAILURE run=${context.runId}`
            );
