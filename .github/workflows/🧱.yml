name: "🧱"

on:
  push:
    branches:
      - main
      - "⏩🏁"
  workflow_dispatch:

concurrency:
  group: "🧱-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  architecture:
    name: "🧪🧱44🔒"
    runs-on:
      - self-hosted
      - Windows
      - X64
    timeout-minutes: 10
    steps:
      - name: "📥"
        uses: actions/checkout@v4

      - name: "🐍🧱"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TOOL_CACHE 'ELArchitecturePython\3.12.10'
          $exe = Join-Path $dir 'python.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            $zip = Join-Path $env:RUNNER_TEMP 'el-architecture-python.zip'
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip' -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          }
          & $exe -c "import sys; assert sys.version_info[:2] == (3, 12)"

      - name: "🧪🧱44"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONIOENCODING = 'utf-8'
          $exe = Join-Path $env:RUNNER_TOOL_CACHE 'ELArchitecturePython\3.12.10\python.exe'
          & $exe architecture\verify_phase1_architecture.py
